name: Build Lucid Waker Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Full Native Kotlin Android Project
        run: |
          mkdir -p app/src/main/java/com/lucidwaker/pro
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LucidWakerUltra"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.lucidwaker.pro'
              compileSdk 34
              defaultConfig {
                  applicationId "com.lucidwaker.pro"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0-Pro"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#060814" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#8B5CF6" android:pathData="M54,20A34,34 0 1,0 88,54A28,28 0 1,1 54,20Z"/>
              <path android:fillColor="#F59E0B" android:pathData="M68,26L72,38L84,42L72,46L68,58L64,46L52,42L64,38Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Lucid Waker Ultra"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".LucidService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/lucidwaker/pro/MainActivity.kt
          package com.lucidwaker.pro

          import android.app.*
          import android.content.*
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.media.*
          import android.net.Uri
          import android.os.*
          import android.speech.tts.TextToSpeech
          import android.view.*
          import android.widget.*
          import java.net.URLEncoder
          import java.util.*
          import kotlin.concurrent.thread
          import kotlin.math.sin

          class MainActivity : Activity(), TextToSpeech.OnInitListener {
              private var tts: TextToSpeech? = null
              private var isAr = true
              private var selectedToneIndex = 0
              private var customToneUri: String? = null
              private lateinit var prefs: SharedPreferences
              private lateinit var rootContainer: FrameLayout

              private val tonesAr = arrayOf(
                  "1. 🗣️ صوت بشري ناطق: (أنا أحلم الآن) + ثيتا",
                  "2. 🗣️ همس واعي: (افحص واقعك، أنت في حلم)",
                  "3. 🌸 ضوضاء وردية عميقة (Pink Noise)",
                  "4. ☁️ ضوضاء بيضاء نقية (White Noise)",
                  "5. 🍂 ضوضاء بنية دافئة (Brown Noise)",
                  "6. 🧠 نبضات ثيتا للأحلام الواضحة (6Hz)",
                  "7. ⚡ تردد غاما للوعي الفائق (40Hz)",
                  "8. 🌊 موجات دلتا العميقة (2Hz)",
                  "9. 🌍 رنين شومان الأرضي (7.83Hz)",
                  "10. 🔔 وعاء تبتي مقدس (432Hz)",
                  "11. 💎 وعاء كريستالي نقي (528Hz)",
                  "12. 👁️ تردد البصيرة والأحلام (852Hz)",
                  "13. ✨ تردد التاج الكوني (963Hz)",
                  "14. 🏖️ أمواج المحيط الهادئة",
                  "15. 🌧️ مطر ليلي خفيف",
                  "16. 🎐 أجراس الرياح الأثيرية",
                  "17. 🌌 الفضاء السحيق (174Hz Drone)",
                  "18. 💧 قطرة ماء (إشارة حلم Rausis)",
                  "19. 📡 نبضة سونار الوعي",
                  "20. 🎹 تناغم سماوي دافئ (Chord)",
                  "21. 📂 نغمتي الخاصة من الهاتف"
              )

              private val tonesEn = arrayOf(
                  "1. 🗣️ Human Voice: (I am dreaming now) + Theta",
                  "2. 🗣️ Lucid Whisper: (Check your reality)",
                  "3. 🌸 Deep Pink Noise",
                  "4. ☁️ Pure White Noise",
                  "5. 🍂 Warm Brown Noise",
                  "6. 🧠 Theta Dream Pulse (6Hz)",
                  "7. ⚡ Gamma Lucid Focus (40Hz)",
                  "8. 🌊 Delta Sleep Wave (2Hz)",
                  "9. 🌍 Schumann Resonance (7.83Hz)",
                  "10. 🔔 Tibetan Singing Bowl (432Hz)",
                  "11. 💎 Crystal Bowl (528Hz)",
                  "12. 👁️ Intuition Frequency (852Hz)",
                  "13. ✨ Cosmic Crown (963Hz)",
                  "14. 🏖️ Calm Ocean Waves",
                  "15. 🌧️ Gentle Night Rain",
                  "16. 🎐 Ethereal Wind Chimes",
                  "17. 🌌 Deep Space Drone (174Hz)",
                  "18. 💧 Water Drop Totem (Rausis)",
                  "19. 📡 Lucid Sonar Ping",
                  "20. 🎹 Warm Harmonic Dream Chord",
                  "21. 📂 My Custom Phone Audio"
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("lucid_ultra_prefs", MODE_PRIVATE)
                  isAr = prefs.getBoolean("isAr", true)
                  selectedToneIndex = prefs.getInt("toneIdx", 0)
                  customToneUri = prefs.getString("customUri", null)

                  tts = TextToSpeech(this, this)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 100)
                  }

                  window.statusBarColor = Color.parseColor("#050711")
                  window.navigationBarColor = Color.parseColor("#050711")

                  rootContainer = FrameLayout(this)
                  setContentView(rootContainer)
                  renderMainUI(0)
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.setPitch(0.88f)
                      tts?.setSpeechRate(0.82f)
                  }
              }

              private fun cardBg(strokeColor: String = "#3B2854"): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor("#11172B"))
                      cornerRadius = 42f
                      setStroke(3, Color.parseColor(strokeColor))
                  }
              }

              private fun btnBg(c1: String, c2: String): GradientDrawable {
                  return GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(Color.parseColor(c1), Color.parseColor(c2))
                  ).apply { cornerRadius = 36f }
              }

              private fun renderMainUI(activeTab: Int) {
                  rootContainer.removeAllViews()
                  val mainLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#050711"))
                      layoutDirection = if (isAr) View.LAYOUT_DIRECTION_RTL else View.LAYOUT_DIRECTION_LTR
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(40, 45, 40, 25)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val titleCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }
                  titleCol.addView(TextView(this).apply {
                      text = "🧭 Lucid Waker Ultra"
                      textSize = 21f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#FDE68A"))
                  })
                  titleCol.addView(TextView(this).apply {
                      text = if (isAr) "النسخة الأصلية للأحلام الواضحة والأهداف النجمية" else "Native Lucid Dreaming & Astral Studio"
                      textSize = 12f
                      setTextColor(Color.parseColor("#94A3B8"))
                  })
                  val langBtn = Button(this).apply {
                      text = if (isAr) "English" else "العربية"
                      setTextColor(Color.WHITE)
                      background = cardBg("#06B6D4")
                      setOnClickListener {
                          isAr = !isAr
                          prefs.edit().putBoolean("isAr", isAr).apply()
                          renderMainUI(activeTab)
                      }
                  }
                  topBar.addView(titleCol)
                  topBar.addView(langBtn)
                  mainLayout.addView(topBar)

                  val scroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, 0, 1f)
                  }
                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(36, 10, 36, 60)
                  }

                  if (activeTab == 0) buildAlarmAndTargetTab(content)
                  else if (activeTab == 1) buildSoundsTab(content)
                  else buildJournalAndSignsTab(content)

                  scroll.addView(content)
                  mainLayout.addView(scroll)

                  val navBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#0B0F1F"))
                      setPadding(16, 20, 16, 20)
                  }
                  val tabs = if (isAr) listOf("⏰ المنبه والهدف", "🎧 20 نغمة", "🔮 السجل والعلامات")
                             else listOf("⏰ Alarm & Goal", "🎧 20 Sounds", "🔮 Signs & Log")
                  tabs.forEachIndexed { idx, label ->
                      val b = Button(this).apply {
                          text = label
                          textSize = 12.5f
                          setTextColor(if (activeTab == idx) Color.parseColor("#FDE68A") else Color.parseColor("#94A3B8"))
                          background = if (activeTab == idx) cardBg("#F59E0B") else null
                          layoutParams = LinearLayout.LayoutParams(0, -2, 1f).apply { setMargins(8, 0, 8, 0) }
                          setOnClickListener { renderMainUI(idx) }
                      }
                      navBar.addView(b)
                  }
                  mainLayout.addView(navBar)
                  rootContainer.addView(mainLayout)
              }

              private fun buildAlarmAndTargetTab(parent: LinearLayout) {
                  val targetCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = cardBg("#F59E0B")
                      setPadding(36, 36, 36, 36)
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 32 }
                  }
                  targetCard.addView(TextView(this).apply {
                      text = if (isAr) "✨ هدف الليلة وجملة التلقين الصوتي البشري" else "✨ Tonight's Target & Human Voice Prompt"
                      textSize = 15.5f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#FDE68A"))
                  })

                  val targetInput = EditText(this).apply {
                      setText(prefs.getString("targetTxt", if (isAr) "أنا أحلم الآن.. جسدي نائم وعقلي واعٍ، سأنظر في المرآة داخل الحلم" else "I am dreaming right now, my mind is awake and I will look into a mirror"))
                      setTextColor(Color.WHITE)
                      textSize = 14.5f
                  }
                  targetCard.addView(targetInput)

                  val testSpeakBtn = Button(this).apply {
                      text = if (isAr) "🔊 سماع صوت المتحدث ينطق الهدف الآن" else "🔊 Test Human Voice Prompt Now"
                      setTextColor(Color.WHITE)
                      background = btnBg("#7C3AED", "#0891B2")
                      setOnClickListener {
                          val txt = targetInput.text.toString()
                          prefs.edit().putString("targetTxt", txt).apply()
                          speakHumanVoice(this@MainActivity, tts, txt, isAr)
                      }
                  }
                  targetCard.addView(testSpeakBtn)
                  parent.addView(targetCard)

                  val alarmCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = cardBg("#8B5CF6")
                      setPadding(36, 36, 36, 36)
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 32 }
                  }

                  var startAfterMins = prefs.getInt("startMins", 270)
                  var repeatEveryMins = prefs.getInt("repMins", 15)
                  var repeatCount = prefs.getInt("repCount", 3)
                  var autoStopSec = prefs.getInt("autoStop", 25)

                  val startLabel = TextView(this).apply {
                      text = if (isAr) "⏰ بدء المنبه الأول بعد: $startAfterMins دقيقة (أو اختر دورة REM)" else "⏰ First Alarm in: $startAfterMins mins"
                      setTextColor(Color.parseColor("#67E8F9"))
                      textSize = 14.5f
                      setTypeface(null, Typeface.BOLD)
                  }
                  alarmCard.addView(startLabel)

                  val remRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = 16; bottomMargin = 20 }
                  }
                  listOf(1 to (if (isAr) "بعد دقيقة (تجربة)" else "1m (Test)"), 90 to "90m", 270 to "4.5h REM", 360 to "6h REM").forEach { (mins, lbl) ->
                      remRow.addView(Button(this).apply {
                          text = lbl
                          textSize = 11.5f
                          setTextColor(Color.WHITE)
                          background = cardBg("#06B6D4")
                          layoutParams = LinearLayout.LayoutParams(0, -2, 1f).apply { setMargins(6, 0, 6, 0) }
                          setOnClickListener {
                              startAfterMins = mins
                              prefs.edit().putInt("startMins", mins).apply()
                              startLabel.text = if (isAr) "⏰ بدء المنبه الأول بعد: $startAfterMins دقيقة" else "⏰ First Alarm in: $startAfterMins mins"
                          }
                      })
                  }
                  alarmCard.addView(remRow)

                  val repCountLbl = TextView(this).apply {
                      text = if (isAr) "🔁 عدد مرات التكرار المتتالي: $repeatCount مرات" else "🔁 Repeat Cycles: $repeatCount times"
                      setTextColor(Color.WHITE)
                  }
                  alarmCard.addView(repCountLbl)
                  alarmCard.addView(SeekBar(this).apply {
                      max = 10
                      progress = repeatCount
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, b: Boolean) {
                              repeatCount = p.coerceAtLeast(1)
                              prefs.edit().putInt("repCount", repeatCount).apply()
                              repCountLbl.text = if (isAr) "🔁 عدد مرات التكرار المتتالي: $repeatCount مرات" else "🔁 Repeat Cycles: $repeatCount times"
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  })

                  val repGapLbl = TextView(this).apply {
                      text = if (isAr) "⏱️ الفاصل الزمني بين كل رنة: كل $repeatEveryMins دقيقة" else "⏱️ Interval Between Rings: $repeatEveryMins mins"
                      setTextColor(Color.WHITE)
                      setPadding(0, 20, 0, 0)
                  }
                  alarmCard.addView(repGapLbl)
                  alarmCard.addView(SeekBar(this).apply {
                      max = 90
                      progress = repeatEveryMins
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, b: Boolean) {
                              repeatEveryMins = p.coerceAtLeast(5)
                              prefs.edit().putInt("repMins", repeatEveryMins).apply()
                              repGapLbl.text = if (isAr) "⏱️ الفاصل الزمني بين كل رنة: كل $repeatEveryMins دقيقة" else "⏱️ Interval Between Rings: $repeatEveryMins mins"
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  })

                  val autoStopLbl = TextView(this).apply {
                      text = if (isAr) "🛑 الإيقاف التلقائي بدون لمس (DEILD): بعد $autoStopSec ثانية" else "🛑 Touchless Auto-Stop: after $autoStopSec sec"
                      setTextColor(Color.WHITE)
                      setPadding(0, 20, 0, 0)
                  }
                  alarmCard.addView(autoStopLbl)
                  alarmCard.addView(SeekBar(this).apply {
                      max = 90
                      progress = autoStopSec
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, b: Boolean) {
                              autoStopSec = p.coerceAtLeast(5)
                              prefs.edit().putInt("autoStop", autoStopSec).apply()
                              autoStopLbl.text = if (isAr) "🛑 الإيقاف التلقائي بدون لمس (DEILD): بعد $autoStopSec ثانية" else "🛑 Touchless Auto-Stop: after $autoStopSec sec"
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  })

                  parent.addView(alarmCard)

                  val startSleepBtn = Button(this).apply {
                      text = if (isAr) "🌙 تفعيل المنبه والتلقين والعمل في الخلفية" else "🌙 Activate Night Session in Background"
                      textSize = 16f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#050711"))
                      background = btnBg("#F59E0B", "#FBBF24")
                      setPadding(20, 36, 20, 36)
                      setOnClickListener {
                          val txt = targetInput.text.toString()
                          prefs.edit().putString("targetTxt", txt).apply()
                          val svc = Intent(this@MainActivity, LucidService::class.java).apply {
                              putExtra("ACTION", "START_SLEEP")
                              putExtra("TONE_IDX", selectedToneIndex)
                              putExtra("CUSTOM_URI", customToneUri)
                              putExtra("TARGET_TXT", txt)
                              putExtra("IS_AR", isAr)
                              putExtra("START_MINS", startAfterMins)
                              putExtra("REP_MINS", repeatEveryMins)
                              putExtra("REP_COUNT", repeatCount)
                              putExtra("AUTO_STOP_SEC", autoStopSec)
                          }
                          if (Build.VERSION.SDK_INT >= 26) startForegroundService(svc) else startService(svc)
                          showOledSleepScreen(txt)
                      }
                  }
                  parent.addView(startSleepBtn)
              }

              private fun buildSoundsTab(parent: LinearLayout) {
                  val customCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = cardBg("#06B6D4")
                      setPadding(36, 36, 36, 36)
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 28 }
                  }
                  customCard.addView(TextView(this).apply {
                      text = if (isAr) "📂 اختيار نغمة أو تسجيل خاص من هاتفك" else "📂 Pick Custom Ringtone / Voice from Phone"
                      textSize = 15f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#67E8F9"))
                  })
                  val pickBtn = Button(this).apply {
                      text = if (isAr) "🎵 اضغط لاختيار ملف صوتي (MP3 / WAV)" else "🎵 Select Audio File from Phone"
                      setTextColor(Color.WHITE)
                      background = btnBg("#0891B2", "#7C3AED")
                      setOnClickListener {
                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "audio/*"
                          }
                          startActivityForResult(intent, 202)
                      }
                  }
                  customCard.addView(pickBtn)
                  parent.addView(customCard)

                  val testRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 24 }
                  }
                  testRow.addView(Button(this).apply {
                      text = if (isAr) "▶️ تجربة النغمة المختارة" else "▶️ Test Selected Sound"
                      setTextColor(Color.WHITE)
                      background = btnBg("#10B981", "#059669")
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f).apply { setMargins(8, 0, 8, 0) }
                      setOnClickListener {
                          val svc = Intent(this@MainActivity, LucidService::class.java).apply {
                              putExtra("ACTION", "TEST_NOW")
                              putExtra("TONE_IDX", selectedToneIndex)
                              putExtra("CUSTOM_URI", customToneUri)
                              putExtra("TARGET_TXT", prefs.getString("targetTxt", "أنا أحلم الآن"))
                              putExtra("IS_AR", isAr)
                              putExtra("AUTO_STOP_SEC", 15)
                          }
                          if (Build.VERSION.SDK_INT >= 26) startForegroundService(svc) else startService(svc)
                      }
                  })
                  testRow.addView(Button(this).apply {
                      text = if (isAr) "⏹️ إيقاف الصوت" else "⏹️ Stop Sound"
                      setTextColor(Color.WHITE)
                      background = cardBg("#EF4444")
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f).apply { setMargins(8, 0, 8, 0) }
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, LucidService::class.java))
                      }
                  })
                  parent.addView(testRow)

                  val list = if (isAr) tonesAr else tonesEn
                  list.forEachIndexed { idx, title ->
                      val item = TextView(this).apply {
                          text = title
                          textSize = 14.5f
                          setTextColor(if (selectedToneIndex == idx) Color.parseColor("#FDE68A") else Color.WHITE)
                          setPadding(34, 30, 34, 30)
                          background = cardBg(if (selectedToneIndex == idx) "#F59E0B" else "#262F4D")
                          layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 16 }
                          setOnClickListener {
                              selectedToneIndex = idx
                              prefs.edit().putInt("toneIdx", idx).apply()
                              renderMainUI(1)
                          }
                      }
                      parent.addView(item)
                  }
              }

              private fun buildJournalAndSignsTab(parent: LinearLayout) {
                  val dreamsSet = prefs.getStringSet("dreams_log", emptySet())?.toMutableList() ?: mutableListOf()

                  val signsCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = cardBg("#F59E0B")
                      setPadding(36, 36, 36, 36)
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 28 }
                  }
                  signsCard.addView(TextView(this).apply {
                      text = if (isAr) "🔮 العلامات والرموز الأكثر تكراراً في أحلامك:" else "🔮 Top Recurring Dream Signs:"
                      textSize = 15f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#FDE68A"))
                  })

                  val freq = mutableMapOf<String, Int>()
                  val stopWords = setOf("في", "من", "على", "إلى", "هذا", "كان", "كنت", "أنا", "حلم", "رأيت", "the", "and", "was", "in", "to")
                  dreamsSet.forEach { d ->
                      d.split(Regex("\\s+")).forEach { w ->
                          val clean = w.trim()
                          if (clean.length >= 3 && !stopWords.contains(clean)) {
                              freq[clean] = (freq[clean] ?: 0) + 1
                          }
                      }
                  }
                  val topSigns = freq.entries.sortedByDescending { it.value }.take(8)
                  signsCard.addView(TextView(this).apply {
                      text = if (topSigns.isEmpty()) (if (isAr) "دوّن أحلامك بالأسفل ليقوم التطبيق باستخراج رموزك المتكررة تلقائياً." else "Log dreams below to auto-extract dream signs.")
                             else topSigns.joinToString("  •  ") { "🔍 ${it.key} (${it.value})" }
                      setTextColor(Color.parseColor("#67E8F9"))
                      setPadding(0, 14, 0, 0)
                  })
                  parent.addView(signsCard)

                  val addCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = cardBg("#8B5CF6")
                      setPadding(36, 36, 36, 36)
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 28 }
                  }
                  val dreamInput = EditText(this).apply {
                      hint = if (isAr) "اكتب تفاصيل حلمك أو تجربة الخروج النجمي هنا..." else "Write your dream or OBE experience..."
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                  }
                  addCard.addView(dreamInput)
                  addCard.addView(Button(this).apply {
                      text = if (isAr) "💾 حفظ الحلم وتحليل العلامات" else "💾 Save Dream & Analyze Signs"
                      setTextColor(Color.WHITE)
                      background = btnBg("#7C3AED", "#0891B2")
                      setOnClickListener {
                          val t = dreamInput.text.toString().trim()
                          if (t.isNotEmpty()) {
                              dreamsSet.add(t)
                              prefs.edit().putStringSet("dreams_log", dreamsSet.toSet()).apply()
                              renderMainUI(2)
                          }
                      }
                  })
                  parent.addView(addCard)

                  dreamsSet.reversed().forEach { d ->
                      parent.addView(TextView(this).apply {
                          text = "🌟 $d"
                          setTextColor(Color.WHITE)
                          setPadding(32, 28, 32, 28)
                          background = cardBg("#262F4D")
                          layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 16 }
                      })
                  }
              }

              private fun showOledSleepScreen(targetTxt: String) {
                  rootContainer.removeAllViews()
                  val oled = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.BLACK)
                      gravity = Gravity.CENTER
                      setPadding(48, 48, 48, 48)
                  }
                  oled.addView(TextView(this).apply {
                      text = "🌙"
                      textSize = 52f
                      gravity = Gravity.CENTER
                  })
                  oled.addView(TextView(this).apply {
                      text = if (isAr) "المنبه الليلي وجلسة التلقين يعملان الآن في الخلفية" else "Night Alarm & Voice Incubation Active in Background"
                      setTextColor(Color.parseColor("#4467E8F9"))
                      textSize = 15f
                      gravity = Gravity.CENTER
                      setPadding(0, 24, 0, 20)
                  })
                  oled.addView(TextView(this).apply {
                      text = "\"$targetTxt\""
                      setTextColor(Color.parseColor("#55FDE68A"))
                      textSize = 18f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 80)
                  })
                  oled.addView(Button(this).apply {
                      text = if (isAr) "إيقاف الجلسة والخروج" else "Stop & Exit Sleep Mode"
                      setTextColor(Color.GRAY)
                      background = cardBg("#333333")
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, LucidService::class.java))
                          renderMainUI(0)
                      }
                  })
                  rootContainer.addView(oled)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 202 && resultCode == RESULT_OK) {
                      data?.data?.let { uri ->
                          try {
                              contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          } catch (e: Exception) {}
                          customToneUri = uri.toString()
                          selectedToneIndex = 20
                          prefs.edit().putString("customUri", customToneUri).putInt("toneIdx", 20).apply()
                          renderMainUI(1)
                      }
                  }
              }

              companion object {
                  fun speakHumanVoice(ctx: Context, fallbackTts: TextToSpeech?, text: String, isAr: Boolean) {
                      thread {
                          try {
                              val langCode = if (isAr) "ar" else "en"
                              val encoded = URLEncoder.encode(text.take(180), "UTF-8")
                              val url = "https://translate.googleapis.com/translate_tts?ie=UTF-8&client=tw-ob&tl=$langCode&q=$encoded"
                              val mp = MediaPlayer().apply {
                                  setAudioAttributes(
                                      AudioAttributes.Builder()
                                          .setUsage(AudioAttributes.USAGE_ALARM)
                                          .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                          .build()
                                  )
                                  setDataSource(url)
                                  prepare()
                                  start()
                              }
                              mp.setOnCompletionListener { it.release() }
                          } catch (e: Exception) {
                              fallbackTts?.language = if (isAr) Locale("ar") else Locale.US
                              fallbackTts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "LucidVoice")
                          }
                      }
                  }
              }
          }

          class LucidService : Service(), TextToSpeech.OnInitListener {
              private var isRunning = false
              private var tts: TextToSpeech? = null
              private var mediaPlayer: MediaPlayer? = null
              private var audioTrack: AudioTrack? = null

              override fun onCreate() {
                  super.onCreate()
                  tts = TextToSpeech(this, this)
              }

              override fun onInit(status: Int) {}

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.getStringExtra("ACTION") ?: "TEST_NOW"
                  val toneIdx = intent?.getIntExtra("TONE_IDX", 0) ?: 0
                  val customUri = intent?.getStringExtra("CUSTOM_URI")
                  val targetTxt = intent?.getStringExtra("TARGET_TXT") ?: "أنا أحلم الآن"
                  val isAr = intent?.getBooleanExtra("IS_AR", true) ?: true
                  val startMins = intent?.getIntExtra("START_MINS", 270) ?: 270
                  val repMins = intent?.getIntExtra("REP_MINS", 15) ?: 15
                  val repCount = intent?.getIntExtra("REP_COUNT", 3) ?: 3
                  val autoStopSec = intent?.getIntExtra("AUTO_STOP_SEC", 25) ?: 25

                  val channelId = "LucidUltraChannel"
                  if (Build.VERSION.SDK_INT >= 26) {
                      val ch = NotificationChannel(channelId, "Lucid Waker Active", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(ch)
                  }
                  val notif = if (Build.VERSION.SDK_INT >= 26) {
                      Notification.Builder(this, channelId)
                  } else {
                      Notification.Builder(this)
                  }.setContentTitle("🌙 Lucid Waker Ultra")
                   .setContentText(targetTxt)
                   .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                   .build()

                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, notif, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                  } else {
                      startForeground(1, notif)
                  }

                  isRunning = false
                  Thread.sleep(150)
                  isRunning = true

                  if (action == "TEST_NOW") {
                      playToneCycle(toneIdx, customUri, targetTxt, isAr, autoStopSec)
                  } else {
                      MainActivity.speakHumanVoice(this, tts, targetTxt, isAr)
                      thread {
                          val firstDelayMs = startMins * 60 * 1000L
                          val startWait = System.currentTimeMillis()
                          while (isRunning && System.currentTimeMillis() - startWait < firstDelayMs) {
                              Thread.sleep(1000)
                          }
                          var cycle = 0
                          while (isRunning && cycle <= repCount) {
                              playToneCycle(toneIdx, customUri, targetTxt, isAr, autoStopSec)
                              cycle++
                              val gapMs = repMins * 60 * 1000L
                              val gapStart = System.currentTimeMillis()
                              while (isRunning && System.currentTimeMillis() - gapStart < gapMs) {
                                  Thread.sleep(1000)
                              }
                          }
                      }
                  }
                  return START_STICKY
              }

              private fun playToneCycle(toneIdx: Int, customUri: String?, targetTxt: String, isAr: Boolean, autoStopSec: Int) {
                  thread {
                      if (toneIdx == 0 || toneIdx == 1) {
                          val phrase = if (toneIdx == 1) (if (isAr) "افحص واقعك الآن.. أنت داخل حلم واعي" else "Check your reality now, you are dreaming") else targetTxt
                          MainActivity.speakHumanVoice(this, tts, phrase, isAr)
                      }
                      if (toneIdx == 20 && !customUri.isNullOrEmpty()) {
                          try {
                              mediaPlayer?.release()
                              mediaPlayer = MediaPlayer.create(this, Uri.parse(customUri))
                              mediaPlayer?.isLooping = true
                              mediaPlayer?.start()
                              val end = System.currentTimeMillis() + autoStopSec * 1000L
                              while (isRunning && System.currentTimeMillis() < end) Thread.sleep(250)
                              mediaPlayer?.stop()
                          } catch (e: Exception) {}
                          return@thread
                      }

                      val sr = 44100
                      val bufSize = AudioTrack.getMinBufferSize(sr, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT)
                      audioTrack = AudioTrack(AudioManager.STREAM_ALARM, sr, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT, bufSize, AudioTrack.MODE_STREAM)
                      audioTrack?.play()

                      val buf = ShortArray(bufSize)
                      var phase = 0.0
                      var b0 = 0.0; var b1 = 0.0; var b2 = 0.0
                      val startMs = System.currentTimeMillis()
                      val totalMs = autoStopSec * 1000L

                      val freq = when (toneIdx) {
                          5 -> 206.0; 6 -> 240.0; 7 -> 152.0; 8 -> 187.83
                          9 -> 432.0; 10 -> 528.0; 11 -> 852.0; 12 -> 963.0
                          15 -> 660.0; 16 -> 174.0; 17 -> 780.0; 18 -> 587.0
                          else -> 432.0
                      }

                      while (isRunning && System.currentTimeMillis() - startMs < totalMs) {
                          val elapsed = (System.currentTimeMillis() - startMs).toDouble()
                          val fadeFactor = (elapsed / 8000.0).coerceAtMost(1.0)

                          for (i in buf.indices) {
                              val raw = when (toneIdx) {
                                  2, 13, 14 -> {
                                      val w = Math.random() * 2.0 - 1.0
                                      b0 = 0.99 * b0 + w * 0.05
                                      b1 = 0.95 * b1 + w * 0.1
                                      (b0 + b1) * 5000.0
                                  }
                                  3 -> (Math.random() * 2.0 - 1.0) * 4500.0
                                  4 -> {
                                      val w = Math.random() * 2.0 - 1.0
                                      b2 = (b2 + 0.02 * w) / 1.02
                                      b2 * 14000.0
                                  }
                                  else -> sin(phase) * 7500.0
                              }
                              buf[i] = (raw * fadeFactor).toInt().toShort()
                              phase += 2.0 * Math.PI * freq / sr
                          }
                          audioTrack?.write(buf, 0, buf.size)
                      }
                      try { audioTrack?.stop(); audioTrack?.release() } catch (e: Exception) {}
                  }
              }

              override fun onDestroy() {
                  isRunning = false
                  try { mediaPlayer?.stop(); mediaPlayer?.release() } catch (e: Exception) {}
                  try { audioTrack?.stop(); audioTrack?.release() } catch (e: Exception) {}
                  tts?.shutdown()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Compile Debug APK with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: LucidWaker-Ultra-APK
          path: app/build/outputs/apk/debug/app-debug.apk
