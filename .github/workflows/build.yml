          echo '    final TextView lStart = new TextView(this); lStart.setText((isAr ? "⏰ المنبه الأول بعد (دقائق): " : "⏰ First Alarm in (mins): ") + vals[0]); lStart.setTextColor(Color.parseColor("#67E8F9")); c2.addView(lStart);' >> src/com/lucidwaker/pro/MainActivity.java
          echo '    SeekBar sb0 = new SeekBar(this); sb0.setMax(480); sb0.setProgress(vals[0]); sb0.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() { public void onProgressChanged(SeekBar s, int pr, boolean u) { vals[0] = Math.max(1, pr); prefs.edit().putInt("startM", vals[0]).apply(); lStart.setText((isAr ? "⏰ المنبه الأول بعد (دقائق): " : "⏰ First Alarm in (mins): ") + vals[0]); } public void onStartTrackingTouch(SeekBar s){} public void onStopTrackingTouch(SeekBar s){} }); c2.addView(sb0);' >> src/com/lucidwaker/pro/MainActivity.java
